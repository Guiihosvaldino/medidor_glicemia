{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Alterada - Controle de Glicose</title>
    <link rel="stylesheet" href="{% static 'glicemia/css/style.css' %}">
</head>

<body>
    <div class="bg-animated"></div>

    <div class="auth-page">
        <div class="auth-glass-card">

            <!-- Left: Branding -->
            <div class="auth-branding">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                    <h1>Controle de<br>Glicose</h1>
                </div>

                <div class="brand-tagline">
                    <div class="tag-line1">Tudo</div>
                    <div class="tag-line2">Pronto!</div>
                </div>
            </div>

            <!-- Divider -->
            <div class="auth-divider"></div>

            <!-- Right: Status -->
            <div class="auth-form-panel">
                <h2>Senha Alterada</h2>

                <div style="text-align: center; margin: 30px 0;">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="#4CAF50" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>

                <p style="color: #666; margin-bottom: 20px; font-size: 0.95rem; text-align: center; line-height: 1.5;">
                    Sua senha foi definida com sucesso. Você já pode acessar sua conta usando a nova senha.
                </p>

                <div style="margin-top: 30px; text-align: center;">
                    <a href="{% url 'login' %}" class="btn" style="text-decoration: none; display: inline-block;">Fazer Login</a>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
